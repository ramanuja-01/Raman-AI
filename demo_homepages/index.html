<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>RAMAN AI – Next-Gen UI Redesign Variants Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --surface: #0b1120;
      --surface-elevated: #111d35;
      --border: rgba(148, 163, 184, 0.15);
      --cyan: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.2);
      --emerald: #10b981;
      --purple: #a855f7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --font: 'Plus Jakarta Sans', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --radius-lg: 16px;
      --radius-sm: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      letter-spacing: -0.01em;
    }

    /* Master Top Toolbar */
    header.master-bar {
      height: 70px;
      background: rgba(11, 17, 32, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-cube {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--cyan), var(--emerald));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 0 15px var(--cyan-glow);
    }
    .brand-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .badge-sub {
      font-size: 0.68rem;
      font-weight: 600;
      background: var(--cyan-glow);
      color: var(--cyan);
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    /* Variant Selector Segmented Control */
    .variant-selector {
      display: flex;
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 4px;
      gap: 4px;
    }
    .btn-variant {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-variant:hover { color: var(--text); }
    .btn-variant.active {
      background: linear-gradient(135deg, var(--cyan), #0284c7);
      color: #fff;
      box-shadow: 0 2px 10px rgba(6, 182, 212, 0.3);
    }

    /* Device Viewport Selector */
    .device-selector {
      display: flex;
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 4px;
      gap: 4px;
    }
    .btn-device {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-device:hover { color: var(--text); }
    .btn-device.active {
      background: var(--surface-elevated);
      color: var(--cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .btn-open-tab {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-open-tab:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    /* Preview Stage Area */
    .preview-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 20%, rgba(6, 182, 212, 0.05) 0%, transparent 60%);
      overflow: hidden;
      min-height: calc(100vh - 70px);
    }

    .frame-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 840px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Device Mockup Shells */
    .mockup-desktop {
      width: 100%;
      height: 860px;
      max-width: 1680px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
      overflow: hidden;
      background: #090d16;
    }

    .mockup-tablet {
      width: 820px;
      height: 880px;
      border-radius: 36px;
      border: 10px solid #1e293b;
      box-shadow: 0 25px 60px -10px rgba(0,0,0,0.8);
      overflow: hidden;
      background: #090d16;
    }

    .mockup-mobile {
      width: 393px;
      height: 820px;
      border-radius: 46px;
      border: 10px solid #1e293b;
      box-shadow: 0 25px 60px -10px rgba(0,0,0,0.8);
      overflow: hidden;
      background: #090d16;
      position: relative;
    }
    .mockup-mobile::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 26px;
      background: #000;
      border-radius: 20px;
      z-index: 999;
      pointer-events: none;
    }

    iframe.preview-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #090d16;
    }
  </style>
</head>
<body>

  <!-- Master Top Navigation -->
  <header class="master-bar">
    <div class="brand-wrap">
      <div class="logo-cube">R</div>
      <div>
        <div class="brand-title">RAMAN AI · UI REDESIGN STUDIO</div>
        <div style="font-size: 0.7rem; color: var(--text-muted);">Interactive Variants Preview (PC, Tablet &amp; Mobile)</div>
      </div>
    </div>

    <!-- Variant Selector -->
    <div class="variant-selector">
      <button class="btn-variant active" onclick="loadVariant('variant_1_clinical_slate.html', this)">
        <span>🌿</span> Variant 1: Clinical Slate
      </button>
      <button class="btn-variant" onclick="loadVariant('variant_2_bento_health_os.html', this)">
        <span>🍱</span> Variant 2: Bento Health OS
      </button>
      <button class="btn-variant" onclick="loadVariant('variant_3_spatial_glass.html', this)">
        <span>🔮</span> Variant 3: Spatial Glass 2.0
      </button>
    </div>

    <!-- Viewport Switcher -->
    <div class="device-selector">
      <button class="btn-device active" onclick="setDevice('desktop', this)">🖥️ Desktop</button>
      <button class="btn-device" onclick="setDevice('tablet', this)">📱 Tablet (820px)</button>
      <button class="btn-device" onclick="setDevice('mobile', this)">📱 Mobile (393px)</button>
    </div>

    <!-- Direct Tab Link -->
    <a href="variant_1_clinical_slate.html" target="_blank" class="btn-open-tab" id="linkExternal">
      <span>↗ Fullscreen Tab</span>
    </a>
  </header>

  <!-- Interactive Live Preview Frame -->
  <main class="preview-stage">
    <div class="frame-wrapper">
      <div class="mockup-desktop" id="deviceShell">
        <iframe src="variant_1_clinical_slate.html" class="preview-iframe" id="previewIframe"></iframe>
      </div>
    </div>
  </main>

  <script>
    let currentVariant = 'variant_1_clinical_slate.html';

    function loadVariant(file, btn) {
      document.querySelectorAll('.btn-variant').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentVariant = file;
      document.getElementById('previewIframe').src = file;
      document.getElementById('linkExternal').href = file;
    }

    function setDevice(device, btn) {
      document.querySelectorAll('.btn-device').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const shell = document.getElementById('deviceShell');

      shell.className = '';
      if (device === 'desktop') {
        shell.className = 'mockup-desktop';
      } else if (device === 'tablet') {
        shell.className = 'mockup-tablet';
      } else if (device === 'mobile') {
        shell.className = 'mockup-mobile';
      }
    }
  </script>
</body>
</html>
